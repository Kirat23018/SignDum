<!DOCTYPE html>
<html>

<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>SiGML Player Applet loc.2017</title>

<meta http-equiv="Access-Control-Allow-Origin" content="*">
<meta http-equiv="Access-Control-Allow-Methods" content="GET">

<link rel="stylesheet" href="https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/cwa/cwasa.css" />
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #e5e7eb;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .CWASAAvatar {
    width: 100% !important;
    height: 100% !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    overflow: hidden !important;
  }
  .CWASAAvatar canvas, .CWASAAvatar > * {
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    margin: 0 auto !important;
    display: block !important;
  }
</style>
<script type="text/javascript" src="https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/cwa/allcsa.js"></script>
<script language="javascript">
	window.isCwasaReady = false;
	window.pendingSiGML = null;

	// Initial configuration with explicit HTTPS URLs to avoid mixed content blocking on deployed HTTPS sites
	var initCfg = {
		"jasBase": "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/",
		"cwaBase": "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/cwa/",
		"useCwaConfig": false,
		"useAvatarJARs": true,
		"avJARBase": "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/avatars/",
		"sigmlBase": "https://vhg.cmp.uea.ac.uk/tech/jas/vhg2017/sigml/",
		"avsbsl": ["luna", "siggi", "anna", "marc", "francoise"],
		"avSettings": { "avList": "avsbsl", "initAv": "luna" },
		"initCallback": function() {
			window.isCwasaReady = true;
			if (window.pendingSiGML) {
				var toPlay = window.pendingSiGML;
				window.pendingSiGML = null;
				setTimeout(function() {
					startPlayer(toPlay);
				}, 200);
			}
		}
	};
</script>

</head>

<body onload="CWASA.init(initCfg);" >

<script language="javascript">

function playText(stext) {
	if (!stext) return;
	try {
		if (typeof CWASA !== 'undefined' && CWASA.playSiGMLText) {
			try { CWASA.stop(); } catch(e) {}
			CWASA.playSiGMLText(stext);
		}
	} catch (e) {
		console.warn("playText error:", e);
	}
}

function setSiGMLURL(sigmlURL) {
	if (!sigmlURL) return "";
	var url = String(sigmlURL).trim();
	if (!url.startsWith("http://") && !url.startsWith("https://")) {
		var loc = window.location.href;
		var locDir = loc.substring(0, loc.lastIndexOf('/'));
		if (url.startsWith('/')) {
			url = url.substring(1);
		}
		url = locDir + "/" + url;
	}
	var urlEl = document.getElementById("URLText");
	if (urlEl) urlEl.value = url;
	return url;
}

function startPlayer(sigmlURL) {
	if (!sigmlURL) return;
	var fullUrl = setSiGMLURL(sigmlURL);
	
	var isReady = false;
	try {
		if (typeof CWASA !== 'undefined' && CWASA.isInitialised && CWASA.isInitialised()) {
			isReady = true;
		} else if (window.isCwasaReady) {
			isReady = true;
		}
	} catch(e) {
		isReady = false;
	}

	if (!isReady) {
		window.pendingSiGML = fullUrl;
		return;
	}

	try {
		if (typeof CWASA !== 'undefined' && CWASA.playSiGMLURL) {
			try { CWASA.stop(); } catch(e) {}
			CWASA.playSiGMLURL(fullUrl);
		}
	} catch (err) {
		console.warn("Error in CWASA.playSiGMLURL, trying fallback text fetch:", err);
		fetch(fullUrl)
			.then(function(res) { return res.text(); })
			.then(function(xmlText) {
				if (xmlText && typeof CWASA !== 'undefined' && CWASA.playSiGMLText) {
					CWASA.playSiGMLText(xmlText);
				}
			})
			.catch(function(e) {
				console.error("SiGML fetch fallback failed:", e);
			});
	}
}

// Global window message listener for cross-frame commands
window.addEventListener("message", function(event) {
	if (!event || !event.data) return;
	var data = event.data;
	if (typeof data === "object") {
		if (data.type === "PLAY_SIGML" || data.type === "START_PLAYER") {
			var file = data.file || data.url || data.sigml;
			if (file) startPlayer(file);
		} else if (data.type === "PLAY_TEXT") {
			if (data.text) playText(data.text);
		}
	} else if (typeof data === "string" && (data.includes(".sigml") || data.startsWith("SignFiles/"))) {
		startPlayer(data);
	}
});

// Periodic check in case initCallback is not fired by the library
var readyChecker = setInterval(function() {
	try {
		if (typeof CWASA !== 'undefined' && CWASA.isInitialised && CWASA.isInitialised()) {
			window.isCwasaReady = true;
			if (window.pendingSiGML) {
				var toPlay = window.pendingSiGML;
				window.pendingSiGML = null;
				startPlayer(toPlay);
			}
			clearInterval(readyChecker);
		}
	} catch(e) {}
}, 400);

</script>

<div style="box-sizing: border-box; width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; display: flex; justify-content: center; align-items: center;" >
<table align="center" style="width: 100%; height: 100%; border: 0; margin: 0; border-spacing: 0px; border-collapse: collapse;" >
<tr align="center" style="width: 100%; height: 100%;">

Sign/Frame:

</span>

Gloss:
<input class="txtGloss av0" value="" type="text">
</span>

<!--  CachedSiGML URL  -->
<input type="text" id="URLText" class="txtSiGMLURL av0 undisplayed" value="" />

</td>

</div>

</body>

</html>
